site_name: Pizza Analytics
site_description: Pipeline autoral de engenharia de dados — Pizza Paradise
site_url: https://lal3x.github.io/end-to-end-pizza-analytics/
repo_url: https://github.com/Lal3x/end-to-end-pizza-analytics
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  /historico.md
  /plano.md
  /metodologia.md
  /avaliacao-pizza-paradise.md
  /migracao-pizza-paradise.md
  /execucao-etapa-zero.md
  /execucao-db.md
  /execucao-ingestao.md
  /execucao-ui.md
  /validacao-refined.md
  /validacao-specs-e-fuso.md
  /evidencias/kaggle-list.json
  /evidencias/backup-maven.json
  /evidencias/inspecao.json
  /evidencias/validacao-selects-refined.json
  /evidencias/revisao-specs-sao-paulo.json
theme:
  name: mkdocs
  locale: pt_BR
  color_mode: light
  nav_style: light
plugins:
  - search
hooks:
  - scripts/mkdocs_links.py
extra_css:
  - assets/estilo.css
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: info
  links:
    unrecognized_links: warn
    anchors: warn
nav:
  - Início: index.md
  - Executar do zero: guia-rapido.md
  - Dados e indicadores:
      - Fonte e permissão: fontes-e-licenca.md
      - Modelo e granularidade: modelo.md
      - Contratos dos indicadores: contratos-indicadores.md
  - Decisões e limitações: decisoes.md
