[project]
name = "pizza"
version = "0.1.0"
description = "Pipeline analítico local de vendas — Pizza Paradise"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.4,<2",
    "pandas>=2.2.3,<4",
    "plotly>=6,<7",
    "streamlit>=1.45,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["test/*", "app.py", "ui.py", "scripts/*", ".venv/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
