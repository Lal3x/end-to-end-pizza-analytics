repos:
  - repo: local
    hooks:
      - id: pytest-cov
        name: Testes e cobertura minima de 70%
        entry: uv run --locked pytest --cov
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: ruff-check
        name: Ruff
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: check-yaml
        name: YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: TOML
        entry: uv run --locked check-toml
        language: system
        types: [toml]
      - id: check-merge-conflict
        name: Conflitos de merge
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]
      - id: trailing-whitespace
        name: Espacos finais
        entry: uv run --locked trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: Fim de arquivo
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]
      - id: check-added-large-files
        name: Arquivos grandes
        entry: uv run --locked check-added-large-files --maxkb=1024 --enforce-all
        language: system
      - id: detect-private-key
        name: Chaves privadas
        entry: uv run --locked detect-private-key
        language: system
        types: [text]
      - id: publication-files
        name: Sem dados brutos, bancos ou arquivos locais
        entry: uv run --locked python scripts/verificar_publicacao.py
        language: system
